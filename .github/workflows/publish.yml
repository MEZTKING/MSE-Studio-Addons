name: Publish add-ons

# Every push to main: zip and release add-on versions that aren't released
# yet, then rebuild index.json (the list MSE Studio's store reads).
# Once a day: refresh the download counts in index.json.
on:
  push:
    branches: [main]
    paths: ["addons/**", "external.json", "tools/**", ".github/workflows/publish.yml"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Release new versions and rebuild index.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python tools/build_index.py
      - name: Commit index.json
        run: |
          if git diff --quiet -- index.json; then
            echo "index.json is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "Update index.json [skip ci]"
          git push
