name: Check add-ons

# Pull requests: every addon.json and card list must be valid before it
# can be merged (and so before it reaches anyone's store).
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python tools/build_index.py --check
